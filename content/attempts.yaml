intro:
  eyebrow: "Before the daily log"
  title: "Four starts over two years"
  body: "I've started Ada four times over two years — roughly two months of actual building. Each attempt was unlocked by a new tool, and this is the first time the technology and timing feel right."
attempts:
  - number: 1
    when: "2024"
    title: "Hackathon prototype"
    text: "A hackathon project powered by Gemini 1.5 first put Ada on screen."
