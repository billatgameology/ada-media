  - number: 2
    when: "Spring 2025"
    title: "Camera access"
    text: "When camera access arrived on the Meta Quest, Ada could finally see the real room."
    youtube: "LomnNzXoDPQ"
    youtube_url: "https://youtube.com/shorts/LomnNzXoDPQ"
    vertical: true
  - number: 3
    when: "May 2026"
    title: "OpenClaw and computer use"
    text: "The third attempt started in May 2026, building a complicated WebXR-to-OpenClaw communication layer and making the first attempt at computer use."
  - number: 4
    when: "October 2026"
    title: "The current build"
    text: "The fourth attempt is the current log: a real room, hands, voice, vision and Chrome control, one day at a time."
    current: true
