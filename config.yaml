# ada-media — content studio configuration
# Which platform files the outbox generates, and the few per-platform options.

project:
  name: "ada-media"
  tagline: "Daily build notes from an open-source project in progress."
  site_url: "https://billatgameology.github.io/ada-media"
  repo_url: "https://github.com/billatgameology/ada-media"
  code_url: "https://github.com/billatgameology/project-ada-xr"   # repo the "In code" section cites
  main_url: ""            # optional: your project's main website/repo, if different from this repo
  author: "billatgameology"

social:
  x:
    enabled: true
    include_link: false   # links reduce reach on X; the URL lives in your bio.
                          # flip to true if you'd rather have it in the post.
    thread: false         # true = split the bullets into a numbered thread
  threads:
    enabled: true
  instagram:
    enabled: true
    hashtags: [devlog, buildinpublic, opensource]   # appended to IG captions
  facebook:
    enabled: true
  tiktok:
    enabled: true
  youtube:
    enabled: true

drafting:
  code_repo: "/Users/billw/Code Files/project-ada-xr"   # commits feed the note's "In code" section
  context_commits: 8      # how many recent commits to prefill in a new draft

media_watch:              # folders scanned by `ada.py catalog`
  roots:
    - "/Users/billw/Movies"
    - "/Users/billw/Library/Application Support/odh/device-media/2G0YC28F7002LP"
  extensions: [".mp4", ".mov", ".m4v", ".mkv", ".avi", ".webm"]
  min_size_mb: 5          # ignore tiny clips
  exclude_dirs:           # any folder whose name contains one of these is skipped
    - ".fcpbundle"
    - ".localized"
    - ".tvlibrary"
    - ".thumbnails"
    - "$RECYCLE.BIN"

transcribe:
  engine: auto            # auto | mlx | faster
  model: turbo            # turbo | large-v3 | medium | small | base | tiny (or a HF repo path)
  language: auto          # or "en", "es", ... to force a language
